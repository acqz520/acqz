# Pages CMS config: https://pagescms.org/docs/configuration/
media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [image]
    rename: safe

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: pubDatetime
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
        description: One or two sentences shown in post lists and search results.
      - name: pubDatetime
        label: Published at
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: modDatetime
        label: Updated at
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: tags
        label: Tags
        type: string
        list: true
      - name: featured
        label: Featured on home page
        type: boolean
      - name: draft
        label: Draft (not published)
        type: boolean
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: images

  - name: about
    label: About page
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: string
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: images

  - name: projects
    label: Projects page
    type: file
    path: src/content/pages/projects.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: string
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: images

  - name: resume
    label: Resume page
    type: file
    path: src/content/pages/resume.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: string
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: images
